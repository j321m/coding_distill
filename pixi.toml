[workspace]
authors = ["Janek <jan.malasnicki@gmail.com>"]
channels = ["conda-forge"]
name = "coding_distill"
version = "0.1.0"

platforms = [
  { platform = "osx-arm64", macos = "14.0" },   # -> named "osx-arm64-macos-14-0"
  "linux-64",
  "linux-aarch64",
]

[feature.helios]
platforms = ["linux-aarch64"]

[feature.local]
platforms = ["osx-arm64-macos-14-0", "linux-64"]

[feature.entropy]
platforms = ["linux-64"]

[environments]
default = { features = ["local"] }
helios  = { features = ["cuda", "helios"] }
entropy = { features = ["cuda", "entropy"] }

[activation.env]
WANDB_ENTITY = "wmasarczyk_ideas"
WANDB_PROJECT = "coding_distill"

[tasks]
# repo-scoped mrunner: pixi run mrun --context entropy run configs/toy.py
# `python -m`, not the `mrunner` console script: mrunner exec()s the config file
# (experiment.py:119) with no package context, and the console script puts its own
# bin/ on sys.path -- `python -m` puts the cwd there instead, so `from
# configs.common import ...` resolves.
mrun = "python -m mrunner.cli.mrunner_cli --config clusters.yaml"
# local CPU run, no backend involved
debug = "python main.py --ex configs/debug.py"
tokenize-debug = "python -m scripts.tokenize_dataset --ex configs/tokenize_debug.py"
update-pixi = "python update_pixi.py"

[dependencies]
python = "==3.12.3"

[pypi-dependencies]
# coding_distill = { path = ".", editable = true }
black = "==25.1.0"
transformers = "*"
datasets = "*"
accelerate = "*"
wandb = "*"
mrunner = { git = "https://gitlab.com/awarelab/mrunner.git" }

[feature.local.pypi-dependencies]
torch = "==2.13.0"

[feature.cuda.pypi-dependencies]
# pin the CUDA build; PyPI's default torch varies in the CUDA it bundles
torch = { version = "==2.13.0", index = "https://download.pytorch.org/whl/cu130" }

[feature.entropy.pypi-dependencies]
# torch's CUDA deps, redeclared only to fetch them off PyPI, which entropy
# reaches at ~1 MB/s -- the pytorch index serves the same wheels 50x faster
nvidia-cublas = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
nvidia-cufft = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
nvidia-cusolver = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
nvidia-cusparselt-cu13 = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
nvidia-cudnn-cu13 = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
nvidia-nccl-cu13 = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
triton = { version = "*", index = "https://download.pytorch.org/whl/cu130" }
