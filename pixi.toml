[workspace]
authors = ["Janek <jan.malasnicki@gmail.com>"]
channels = ["conda-forge"]
name = "coding_distill"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[dependencies]
python = "==3.12.3"

[pypi-dependencies]
coding_distill = { path = ".", editable = true }
transformers = ">=4.55.0"
datasets = ">=3.1.0"
trl = ">=0.21.0"
accelerate = "*"
attrs = "*"
wandb = ">=0.23.1, <0.24"
black = "==25.1.0"
mrunner = { git = "https://gitlab.com/awarelab/mrunner.git" }

[target.linux-64.pypi-dependencies]
torch = { version = "==2.7.1", index = "https://download.pytorch.org/whl/cu128" }
vllm = "*"

[target.osx-arm64.pypi-dependencies]
torch = "*"
