name: black

on:
  pull_request:
    branches: [main]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pip, not pixi: pixi would install the default env, torch included.
      # Keep the version equal to black's pin in pixi.toml.
      - run: pip install black==25.1.0
      - run: black --check --diff .
